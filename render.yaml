services:
  - type: web
    name: pjsktools-api
    runtime: node
    repo: https://github.com/lwh-440/pjsktools
    branch: main
    buildCommand: npm ci && npm run build -w apps/api
    startCommand: npm run start -w apps/api
    healthCheckPath: /health
    autoDeployTrigger: commit
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_HOST
        value: 0.0.0.0
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pjsktools-db
          property: connectionString
      - key: MASTER_RAW_BASE_URL
        value: https://gh.llkk.cc/https://raw.githubusercontent.com
      - key: RANKING_REFRESH_MS
        value: "10000"
      - key: MASTER_REFRESH_MS
        value: "600000"
      - key: AUTO_UPDATE_ENABLED
        value: "true"
      - key: PUBLIC_WEB_BASE_URL
        sync: false

databases:
  - name: pjsktools-db
    databaseName: pjsktools
    user: pjsktools
